version: 2

# All dependency updates (npm and GitHub Actions) arrive as ONE weekly PR via a
# multi-ecosystem group. Each ecosystem below opts in with
# `multi-ecosystem-group` and `patterns: ["*"]` (every dependency, every update
# type: major, minor and patch).
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # commit-message and open-pull-requests-limit may only be set here, not on
    # the ecosystems that join this group (Dependabot rejects the config).
    # Conventional Commit prefix so PR titles pass the "Validate PR title"
    # check. Dependabot appends ": " after a prefix that ends in ")".
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

updates:
  - package-ecosystem: npm
    directory: /
    multi-ecosystem-group: all-dependencies
    patterns:
      - "*"
    # Let new releases age a week before proposing them (supply-chain hygiene).
    cooldown:
      default-days: 7
    ignore:
      # The CLI supports Node >= 20 (package.json "engines"; CI tests 20, 22
      # and 24). These majors would break that floor, so stay on the current
      # major until the floor is raised:
      # - @types/node: track the oldest supported runtime (20.x); newer majors
      #   describe APIs Node 20 lacks and break `npm run typecheck`.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # - google-auth-library 11 requires Node >= 22.
      - dependency-name: "google-auth-library"
        update-types: ["version-update:semver-major"]
      # - vitest 5 requires Node >= 22.12 (and a separate `vite` peer).
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      # tree-sitter-c-sharp >= 0.23.5 is an ES module with top-level await, so
      # the synchronous require() in src/extractors/languages/csharp-parse.ts
      # cannot load it. It is pinned to 0.23.1 until that loader moves to
      # import().
      - dependency-name: "tree-sitter-c-sharp"
        versions: [">= 0.23.5"]

  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: all-dependencies
    patterns:
      - "*"
    cooldown:
      default-days: 7
